<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 20px;
      color: #222;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus { border-color: #555; }

    button.add-btn {
      padding: 10px 18px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    button.add-btn:hover { background: #555; }

    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
    }

    .tab {
      padding: 6px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      color: #555;
    }

    .tab.active {
      background: #333;
      color: #fff;
      border-color: #333;
    }

    ul { list-style: none; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 8px;
      border: 1px solid #eee;
    }

    li.done .task-text {
      text-decoration: line-through;
      color: #aaa;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #333;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
    }

    button.del-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      font-size: 1.1rem;
      line-height: 1;
    }

    button.del-btn:hover { color: #e55; }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
      padding: 30px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>タスク管理</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="タスクを入力..." />
      <button class="add-btn" onclick="addTask()">追加</button>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="setFilter('all', this)">すべて</button>
      <button class="tab" onclick="setFilter('active', this)">未完了</button>
      <button class="tab" onclick="setFilter('done', this)">完了</button>
    </div>
    <ul id="taskList"></ul>
    <p class="empty" id="empty" style="display:none">タスクがありません</p>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let filter = 'all';

    const input = document.getElementById('taskInput');
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    function save() { localStorage.setItem('tasks', JSON.stringify(tasks)); }

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({ id: Date.now(), text, done: false });
      input.value = '';
      save();
      render();
    }

    function toggle(id) {
      const t = tasks.find(t => t.id === id);
      if (t) t.done = !t.done;
      save();
      render();
    }

    function remove(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function setFilter(f, el) {
      filter = f;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    function render() {
      const list = document.getElementById('taskList');
      const empty = document.getElementById('empty');
      const visible = tasks.filter(t =>
        filter === 'all' ? true : filter === 'done' ? t.done : !t.done
      );

      list.innerHTML = visible.map(t => `
        <li class="${t.done ? 'done' : ''}">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggle(${t.id})">
          <span class="task-text">${escHtml(t.text)}</span>
          <button class="del-btn" onclick="remove(${t.id})" title="削除">×</button>
        </li>
      `).join('');

      empty.style.display = visible.length ? 'none' : 'block';
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    render();
  </script>
</body>
</html>
